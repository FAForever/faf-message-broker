quarkus:
  log:
    level: INFO
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s %X%e%n"
  devservices:
    enabled: false
  application:
    name: faf-message-broker
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    db-kind: postgresql
    username: ${DATABASE_USER:faf-message-broker}
    password: ${DATABASE_PASSWORD:banana}
    jdbc:
      url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:faf-messages}?ssl=false}
  flyway:
    migrate-at-start: true
  http:
    host-validation:
      allowed-hosts: ${ALLOWED_HOST:ws.faforever.localhost,localhost}
  rest-client:
    policy-server:
      url: ${POLICY_SERVER_URL:http://localhost:8097}
      disable-default-mapper: true
  management:
    enabled: true

faf:
  use-policy-server: ${USE_POLICY_SERVER:false}
  instance-id: ${HOSTNAME:local}
  player-session-status-refresh-period: ${STATUS_REFRESH_PERIOD:1m}
  real-ip-header: ${REAL_IP_HEADER:X-Real-IP}
  publish-unknown-messages: ${PUBLISH_UNKNOWN_MESSAGES:false}
  unknown-message-route: ${UNKNOWN_MESSAGE_ROUTE:legacy}
  number-of-messages-to-queue-before-auth: ${ALLOWED_MESSAGES_BEFORE_AUTH_COUNT:100}

mp:
  messaging:
    incoming:
      lobby-outbound:
        connector: smallrye-rabbitmq
        exchange:
          durable: true
          name: lobby-message-outbound
        queue:
          durable: true
          auto-delete: true
          exclusive: true
          name: broker.message.outbound.${faf.instance-id}
      lobby-schema-registration:
        connector: smallrye-rabbitmq
        exchange:
          durable: true
          name: lobby-schema-register
        queue:
          durable: true
          auto-delete: true
          exclusive: true
          name: broker.schema.registration.${faf.instance-id}
      player-active-request:
        connector: smallrye-rabbitmq
        exchange:
          durable: true
          name: lobby-session-request
        queue:
          durable: true
          auto-delete: true
          exclusive: true
          name: broker.session.request.${faf.instance-id}
    outgoing:
      lobby-inbound:
        connector: smallrye-rabbitmq
        exchange:
          durable: true
          name: lobby-message-inbound
      player-connection:
        connector: smallrye-rabbitmq
        exchange:
          durable: true
          name: lobby-session-state
      lobby-schema-request:
        connector: smallrye-rabbitmq
        exchange:
          durable: true
          name: lobby-schema-request

  jwt:
    verify:
      issuer: ${HYDRA_TOKEN_ISSUER:http://ory-hydra:4444}
      key-format: JWKS
      publickey:
        location: ${HYDRA_JWKS_URL:http://localhost:4444/.well-known/jwks.json}

rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USER:faf-message-broker}
rabbitmq-password: ${RABBITMQ_PASSWORD:banana}
rabbitmq-virtual-host: ${RABBITMQ_VHOST:/faf-core}

"%test":
  quarkus:
    scheduler:
      enabled: false
    log:
      console:
        json:
          enabled: false
      category:
        "com.faforever":
          level: DEBUG
        "io.quarkus.websockets.next.traffic":
          level: DEBUG

"%dev":
  faf:
    publish-unknown-messages: true
  quarkus:
    live-reload:
      instrumentation: true
    log:
      console:
        json:
          enabled: false
      category:
        "com.faforever":
          level: DEBUG
        "io.quarkus.websockets.next.traffic":
          level: DEBUG
    websockets-next:
      server:
        traffic-logging:
          enabled: true
    hibernate-orm:
      log:
        sql: true
